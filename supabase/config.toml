project_id = "bhlosshvwmlyzhbghsrc"

[auth]
# Cadastro público desativado: só admin cria atendentes (função admin-create-agent)
enable_signup = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-send]
verify_jwt = true

[functions.whatsapp-sync-templates]
verify_jwt = true

[functions.admin-create-agent]
verify_jwt = true

[functions.whatsapp-media]
verify_jwt = true

# verify_jwt = false porque o agendamento diário não tem JWT; a função valida o dono ou o x-cron-secret por conta própria
[functions.meta-ads-sync]
verify_jwt = false

# Webhook do Mercado Pago: sem JWT, a função valida o cabeçalho x-signature (HMAC) por conta própria
[functions.mp-webhook]
verify_jwt = false

# verify_jwt = false porque aceita o dono logado ou outro servidor com a service role key; a função confere os dois
[functions.mp-criar-link]
verify_jwt = false

# Aceita o dono logado, a service role ou o agendamento (x-cron-secret); a função confere por conta própria
[functions.mp-conferir]
verify_jwt = false

# Banco de conhecimento: aceita o dono logado, a service role (n8n) ou o agendamento (x-cron-secret); a função confere por conta própria
[functions.conhecimento]
verify_jwt = false

# Orçamento em PDF: aceita o dono logado (botão Reenviar do CRM) ou a service role (n8n); a função confere os dois
[functions.orcamento-pdf]
verify_jwt = false

# Fotos de produto: aceita o dono logado (tela Catálogo > Fotos) ou a service role (n8n); a função confere os dois
[functions.produto-fotos]
verify_jwt = false

# Envio do agente: só a service role (n8n). Antes de enviar confere IA ligada, modo IA, pedido não pago e janela de 24 h
[functions.agente-enviar]
verify_jwt = false

# Alertas ao dono (push e WhatsApp): processar só com a service role (n8n); teste e chave pública com o dono logado. A função confere os dois.
[functions.alertas-enviar]
verify_jwt = false

# Confirmação ao cliente depois do pagamento (WF5): só a service role
[functions.cliente-pago-avisar]
verify_jwt = false

# Envio proativo (follow-ups, pós-venda e avisos de status): só a service role (WF6, WF7, WF8)
[functions.proativo-enviar]
verify_jwt = false

[functions.produto-opcoes]
verify_jwt = false

# Fichas da loja (E-commerce Fase 2): agendamento (x-cron-secret), dono logado ou service role; a função confere
[functions.loja-fichas]
verify_jwt = false

# Checkout do site (E-commerce Fase 4): público; valida o carrinho, limite no banco e chama mp-criar-link por dentro
[functions.loja-checkout]
verify_jwt = false

# Avisos do Bling (E-commerce Fase 6): sem JWT; a função confere a assinatura HMAC (X-Bling-Signature-256) com BLING_CLIENT_SECRET
[functions.bling-webhook]
verify_jwt = false

# Conversions API da Meta (E-commerce Fase 7): agendamento (x-cron-secret), dono ou service role
[functions.meta-conversions-api]
verify_jwt = false

[functions.blog-pautas]
verify_jwt = false

[functions.loja-frete]
verify_jwt = false
