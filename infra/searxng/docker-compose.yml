# Coolify > Projeto da Sua Gráfica BH > + Novo recurso > Docker Compose (colar este arquivo).
# Nada é publicado na internet: sem domínio e sem portas expostas. O n8n acessa pela rede interna.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - gbh-busca
    deploy:
      resources:
        limits:
          memory: 512M

  renderer:
    build: ../renderer
    container_name: renderer
    restart: unless-stopped
    environment:
      - RENDERER_TOKEN=${RENDERER_TOKEN:-}
      - MAX_CONCORRENTES=2
    networks:
      - gbh-busca
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  gbh-busca:
    name: gbh-busca
